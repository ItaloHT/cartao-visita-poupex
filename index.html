<script>
const examples=[['name','Nome','Marina Costa'],['job','Cargo','Analista de Comunicação'],['unit','Setor','CECOM'],['email','E-mail','marina@example.org'],['phone','Telefone','(61) 0000-0000']];
const byId=id=>document.getElementById(id);
const fields=byId('fields');
for(const [key,label,value] of examples){
 let input=byId('f-'+key);
 if(!input){const wrapper=document.createElement('label');wrapper.textContent=label;input=document.createElement('input');input.id='f-'+key;input.value=value;wrapper.append(input);fields.append(wrapper)}
 const show=()=>byId(key).textContent=input.value;input.oninput=show;show();
}
function styleCard(){document.querySelector('article').className=byId('layout').value;document.documentElement.style.setProperty('--blue',byId('blue').value)}
byId('layout').onchange=styleCard;byId('blue').oninput=styleCard;styleCard();
const images=[...document.querySelectorAll('.brands img')];
images.forEach((img,i)=>byId('logo'+(i+1)).onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{img.src=reader.result;img.hidden=false};reader.readAsDataURL(file);
});
byId('save').onclick=()=>{
 const copy=document.documentElement.cloneNode(true);
 copy.querySelectorAll('input:not([type=file])').forEach(el=>el.setAttribute('value',byId(el.id).value));
 copy.querySelectorAll('option').forEach(el=>el.toggleAttribute('selected',el.value===byId('layout').value));
 copy.querySelector('#notes').textContent=byId('notes').value;
 const url=URL.createObjectURL(new Blob(['<!doctype html>'+copy.outerHTML],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='cartao-layout.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
};
